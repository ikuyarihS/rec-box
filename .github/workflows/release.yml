# Publishes a RecBox release when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
# Builds on Windows with .NET 8, packs Setup.exe + Portable.zip + the update feed with Velopack,
# and uploads them as a GitHub release. Installed and portable copies update from these releases.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version from the tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+([-+].*)?$') { throw "tag ${{ github.ref_name }} is not v<major>.<minor>.<patch>" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "REPO_URL=${{ github.server_url }}/${{ github.repository }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore tools (vpk)
        shell: pwsh
        run: dotnet tool restore

      - name: Download the previous release (so deltas are made)
        shell: pwsh
        # the very first release has nothing to download
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet vpk download github "--repoUrl=$env:REPO_URL" "--token=$env:GITHUB_TOKEN" "--outputDir=Releases"

      - name: Test
        shell: pwsh
        run: dotnet test tests/RecBox.Tests/RecBox.Tests.csproj -c Release --filter "FullyQualifiedName~WorkerAndLogTests|FullyQualifiedName~TranscriptionQueueTests"

      - name: Build and pack
        shell: pwsh
        run: ./build.ps1 -Version $env:VERSION -UpdateUrl $env:REPO_URL

      - name: Upload the release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dotnet vpk upload github "--repoUrl=$env:REPO_URL" "--token=$env:GITHUB_TOKEN" "--outputDir=Releases"
          --publish "--releaseName=RecBox $env:VERSION" "--tag=${{ github.ref_name }}"
